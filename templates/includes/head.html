{% load static %}
    <!-- Required meta tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'front/assets/css/bootstrap.min.css' %}" />
    <!-- MeanMenu CSS -->
    <link rel="stylesheet" href="{% static 'front/assets/css/meanmenu.css' %}" />
    <!-- Fontawsome CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'front/assets/css/fontawesome.min.css' %}" />
    <!-- Flaticon CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'front/assets/css/flaticon.css' %}" />
    <!-- Magnific CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'front/assets/css/magnific-popup.css' %}" />
    <!-- Animate CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'front/assets/css/animate.css' %}" />
    <!-- Owl Carousel CSS -->
    <link rel="stylesheet" href="{% static 'front/assets/css/owl.carousel.min.css' %}" />
    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'front/assets/css/style.css' %}" />
    <!-- Dark CSS -->
    <link rel="stylesheet" href="{% static 'front/assets/css/dark.css' %}" />
    <!-- Responsive CSS -->
    <link rel="stylesheet" href="{% static 'front/assets/css/responsive.css' %}" />

    <link rel="icon" type="image/png" href="{% static 'front/assets/images/favicon.ico' %}" />
    <style>
        .pub-cover-blue {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 24px 28px 28px;
            text-align: center;
            background:
                radial-gradient(90% 70% at 100% 0%, rgba(60, 114, 252, 0.18) 0%, transparent 58%),
                linear-gradient(180deg, #f8faff 0%, #e4edff 100%);
            border-left: 6px solid #3c72fc;
        }
        .pub-cover-blue::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(60, 114, 252, 0.14) 1.2px, transparent 1.2px);
            background-size: 18px 18px;
            pointer-events: none;
        }
        .pub-cover-blue .pub-cover-title {
            position: relative;
            z-index: 1;
            color: #1e3d96;
            font-family: "Playfair Display", serif;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.35;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .pub-cover-blue.pub-cover-lg {
            height: 280px;
            border-radius: 12px;
        }
        .pub-cover-blue.pub-cover-lg .pub-cover-title {
            font-size: 28px;
            -webkit-line-clamp: 5;
        }
        .pub-cover-blue.pub-cover-sm {
            height: 100%;
            min-height: 160px;
            padding: 14px 12px 14px 16px;
        }
        .pub-cover-blue.pub-cover-sm .pub-cover-title {
            font-size: 13px;
            -webkit-line-clamp: 5;
        }
        .pub-cover-blue.pub-cover-home {
            height: 200px;
            border-radius: 0 0 100% 100%;
        }
        .pub-cover-blue.pub-cover-home .pub-cover-title {
            font-size: 18px;
            padding: 0 16px 24px;
            -webkit-line-clamp: 3;
        }
        .course-img:has(.pub-cover-blue)::before {
            display: none;
        }
        .special-single-class .single-sp-class .course-img:has(.pub-cover-blue) .course-content,
        .home-special-course .single-home-special-course .course-img:has(.pub-cover-blue) .course-content {
            height: 0;
        }
        a.pub-cover-blue {
            text-decoration: none;
            color: #1e3d96;
        }
        a.pub-cover-blue:hover {
            background:
                radial-gradient(90% 70% at 100% 0%, rgba(60, 114, 252, 0.28) 0%, transparent 58%),
                linear-gradient(180deg, #eef3ff 0%, #d4e2ff 100%);
        }
        a.pub-cover-blue:hover .pub-cover-title {
            color: #3c72fc;
        }
        /* Le thème peint tous les <a> en bleu au survol de la carte récente */
        .home-ragular-course .single-ragular-course:hover a.pub-cover-blue,
        .home-ragular-course .single-ragular-course:hover a.pub-cover-blue:hover {
            background:
                radial-gradient(90% 70% at 100% 0%, rgba(60, 114, 252, 0.28) 0%, transparent 58%),
                linear-gradient(180deg, #eef3ff 0%, #d4e2ff 100%);
            color: #1e3d96;
        }
        .home-ragular-course .single-ragular-course:hover a.pub-cover-blue .pub-cover-title {
            color: #1e3d96;
        }
        @media (max-width: 767px) {
            .pub-cover-blue.pub-cover-lg {
                height: 200px;
            }
            .pub-cover-blue.pub-cover-lg .pub-cover-title {
                font-size: 20px;
            }
        }
    </style>
